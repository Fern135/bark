# Production-style stack:  docker compose up -d --build
# Only the `proxy` service publishes a port. db, server, ws and web sit on an
# internal network with no route to or from the outside world.

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  proxy:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.29-alpine
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      # Mounted as a template: at start nginx fills in ${WEB_PORT} and writes conf.d/default.conf.
      - ./proxy/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      WEB_PORT: ${WEB_PORT:-3000}
      # Only substitute WEB_PORT, never nginx's own $variables.
      NGINX_ENVSUBST_FILTER: ^WEB_PORT$$
    cap_drop: [ALL]
    depends_on:
      - web
      - server
      - ws
    networks:
      - public
      - internal

  web:
    <<: *hardening
    build:
      context: ./web
      target: runner
      # engine and scripting reach web only through these build contexts.
      additional_contexts:
        engine: service:engine
        scripting: service:scripting
    environment:
      INTERNAL_API_URL: http://server:8000/api
      PORT: ${WEB_PORT:-3000}
    cap_drop: [ALL]
    networks:
      - internal

  # ---- Build-only packages ----
  # engine and scripting are browser libraries bundled into web's image. They never run as
  # containers and join no network, so no other service can reach them.
  engine:
    build:
      context: ./engine
    scale: 0

  scripting:
    build:
      context: ./scripting
      additional_contexts:
        engine: service:engine
    scale: 0

  server:
    <<: *hardening
    build:
      context: ./server
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Django cache (login attempt counters). DB 1 keeps it apart from ws's pub/sub on DB 0.
      DJANGO_CACHE_URL: redis://redis:6379/1
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  ws:
    <<: *hardening
    build:
      context: ./ws
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # Collaboration fan-out only: pub/sub per document plus ephemeral presence. Nothing here
  # is durable, so it needs no volume — documents and locks live in Postgres.
  redis:
    <<: *hardening
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Start as the image's redis user: as root, the entrypoint tries to chown /data and
    # switch users, which cap_drop: [ALL] forbids, so redis would exit on boot.
    user: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
      - /data
    cap_drop: [ALL]
    networks:
      - internal

  db:
    <<: *hardening
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

networks:
  public:
  internal:
    internal: true

volumes:
  pgdata:
