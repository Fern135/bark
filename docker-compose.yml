# Production-style stack:  docker compose up -d --build
# Only the `proxy` service publishes a port. db, server, ws and web sit on an
# internal network with no route to or from the outside world.

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  proxy:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.29-alpine
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    cap_drop: [ALL]
    depends_on:
      - web
      - server
      - ws
    networks:
      - public
      - internal

  web:
    <<: *hardening
    build:
      context: ./web
      target: runner
    environment:
      INTERNAL_API_URL: http://server:8000/api
    cap_drop: [ALL]
    networks:
      - internal

  server:
    <<: *hardening
    build:
      context: ./server
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  ws:
    <<: *hardening
    build:
      context: ./ws
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  db:
    <<: *hardening
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

networks:
  public:
  internal:
    internal: true

volumes:
  pgdata:
