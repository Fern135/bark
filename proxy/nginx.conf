# Single public entrypoint. Everything else lives on the internal Docker network.
#   /        -> web    (Next.js)
#   /api/    -> server (Django)
#   /admin/  -> server (Django admin)
#   /ws/     -> ws     (websockets)

# Docker's internal DNS; resolve upstreams per request so a stopped container doesn't crash nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conns:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    server_tokens off;
    client_max_body_size 10m;
    limit_conn conns 50;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        set $server_upstream http://server:8000;
        proxy_pass $server_upstream;
    }

    location /admin/ {
        limit_req zone=api burst=20 nodelay;
        set $server_upstream http://server:8000;
        proxy_pass $server_upstream;
    }

    location /ws/ {
        set $ws_upstream http://ws:8001;
        proxy_pass $ws_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # ws /health is for Docker only; never expose it.
    location = /ws/health { return 404; }

    location / {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
        # Upgrade headers let Next.js dev hot-reload work through the gateway.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
