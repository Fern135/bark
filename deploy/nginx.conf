resolver 127.0.0.11 valid=10s ipv6=off;

# Only Caddy can assert a client address or TLS scheme. Nothing publishes this port.
set_real_ip_from 172.29.240.2;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
map "$realip_remote_addr:$http_x_forwarded_proto" $trusted_scheme {
    default $scheme;
    "172.29.240.2:https" https;
}
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conns:10m;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;
    limit_conn conns 50;
    limit_req_status 429;
    limit_conn_status 429;

    # Do not log query strings (password reset tokens) or cookies.
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $trusted_scheme;

    location = /gateway-ready {
        allow 127.0.0.1;
        deny all;
        access_log off;
        root /usr/share/nginx/html;
        try_files /index.html =503;
    }
    location ^~ /health/ { return 404; }
    location = /ws/health { return 404; }
    location = /healthz {
        set $api http://server:8000;
        proxy_pass $api/health/ready/;
        add_header Cache-Control no-store always;
    }
    location /static/ {
        alias /static/;
        autoindex off;
    }
    location ~ ^/api/auth/(login|register|forgot-password|reset-password|forgot-username)/$ {
        limit_req zone=auth burst=10 nodelay;
        set $api http://server:8000;
        proxy_pass $api;
    }
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        set $api http://server:8000;
        proxy_pass $api;
    }
    location /admin/ {
        limit_req zone=api burst=20 nodelay;
        set $api http://server:8000;
        proxy_pass $api;
    }
    location /ws/ {
        set $socket http://ws:8001;
        proxy_pass $socket;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Defining upgrade headers here replaces the parent proxy_set_header set.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $trusted_scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
    location / {
        set $web http://web:3000;
        proxy_pass $web;
    }
}
