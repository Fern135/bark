# Use ONLY in a fresh checkout with a disposable .env and a unique Compose project name.
# Combine with docker-compose.yml, never docker-compose.prod.yml.
services:
  server:
    environment:
      RUN_TESTS_ON_START: "0"
  tester:
    build:
      context: .
      dockerfile: deploy/tests.Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_CACHE_URL: redis://redis:6379/1
      DJANGO_MIGRATE_ON_START: "0"
      RUN_TESTS_ON_START: "0"
      WS_TEST_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    networks: [internal]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
